name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests psutil cryptography pyinstaller

      - name: Build Standalone Executable
        run: |
          pyinstaller --onefile --noconsole --name "ClaudeLimitTracker" --icon "assets/icon.ico" --add-data "assets;assets" --add-data "src;src" gui.py

      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ClaudeLimitTracker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ClaudeLimitTracker.exe" | Out-File -FilePath dist/ClaudeLimitTracker.exe.sha256 -Encoding ascii
          Write-Host "Generated SHA256:"
          Get-Content dist/ClaudeLimitTracker.exe.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/ClaudeLimitTracker.exe
            dist/ClaudeLimitTracker.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
